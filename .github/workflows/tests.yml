name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install ruff==0.16.10
      # rules live in pyproject.toml so a local `ruff check .` matches CI
      - run: ruff check --output-format=github .

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # oldest supported (pyproject requires-python) and newest
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # the zstd decoder before 3.14 (pyproject's dependency): without it the
      # seforim.db reader is untested there and its tests are skipped
      - run: pip install "zstandard>=0.22; python_version < '3.14'"
      - run: python -X utf8 -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Wheel ships the web UI
        run: |
          python - <<'EOF'
          import glob, sys, zipfile
          names = set(zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist())
          need = {f'magiah/webui/static/{f}' for f in ('index.html', 'app.js', 'style.css')}
          missing = sorted(need - names)
          if missing:
              sys.exit(f'wheel is missing: {missing}')
          EOF
      - name: Installed CLI starts
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd /tmp && /tmp/venv/bin/magiah --help

  # single stable check name for branch protection, independent of the matrix
  ci-ok:
    if: always()
    needs: [lint, test, package]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
