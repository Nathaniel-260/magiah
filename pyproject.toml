[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magiah"
version = "0.7.0"
description = "Corpus-based typo detection for Hebrew/Aramaic texts - no dictionaries, no AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# seforim.db schema 6 stores line text as zstd frames; Python 3.14+ decodes
# them with the standard library, older interpreters need `zstandard`
dependencies = ["zstandard>=0.22; python_version < '3.14'"]
keywords = ["hebrew", "aramaic", "ocr", "typo", "proofreading", "corpus", "torah", "otzaria"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
    "Natural Language :: Hebrew",
]

[project.scripts]
magiah = "magiah.cli:main"

[project.urls]
Homepage = "https://github.com/Nathaniel-260/magiah"

[tool.setuptools.packages.find]
include = ["magiah*"]

# the review UI is served from these files at runtime; without this the wheel
# installs a UI that only shows its "files not installed" placeholder
[tool.setuptools.package-data]
"magiah.webui" = ["static/*"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["build", "dist", "scan-results", ".claude", ".git-rewrite"]

[tool.ruff.lint]
# pyflakes + syntax errors only: catches real bugs (undefined names, unused
# imports) without imposing a style on existing code
select = ["E9", "F"]
